<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f6f2">
  <title>Les stagiaires | Atelier 6</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#17221f;--muted:#64716c;--line:#dce4de;--green:#176b4a;--paper:#f5f6f2;--white:#fff;--lime:#d7f26a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 'DM Sans',sans-serif}.shell{max-width:1160px;margin:auto;padding:24px 34px 60px}.topbar{height:64px;display:flex;align-items:center;justify-content:space-between}.brand{font:800 18px Manrope,sans-serif;letter-spacing:-.04em;text-decoration:none;color:inherit}.brand-mark{display:inline-grid;place-items:center;width:30px;height:30px;margin-right:9px;border-radius:9px;background:var(--green);color:white;font-size:14px}.top-link{font-weight:600;text-decoration:none;color:var(--green)}.hero{padding:52px 0 30px}.eyebrow{color:var(--green);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}h1{font:800 clamp(40px,6vw,64px)/1.05 Manrope,sans-serif;letter-spacing:-.055em;margin:14px 0}.lead{max-width:580px;color:var(--muted);font-size:18px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:26px 0}.count{font-weight:700}.button{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;background:var(--green);border-radius:10px;color:white;text-decoration:none;font-weight:700;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:18px}.card{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--white);box-shadow:0 15px 38px #183a290b}.photo{display:block;width:100%;height:245px;object-fit:cover;background:#e5eee7}.card-body{padding:18px}.name{font:700 20px Manrope,sans-serif;letter-spacing:-.03em;margin:0}.city{margin:5px 0 13px;color:var(--muted)}.date{display:block;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.notice{padding:25px;border:1px dashed #b8c9bb;border-radius:15px;background:#fff9;color:var(--muted)}.notice.error{color:#a32b22;border-color:#e5bdb7}.footer{margin-top:44px;color:var(--muted);font-size:13px}@media(max-width:580px){.shell{padding:16px 20px 40px}.hero{padding-top:34px}.toolbar{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body><main class="shell">
  <nav class="topbar" aria-label="Navigation principale"><a class="brand" href="index.html"><span class="brand-mark">A6</span>Atelier six</a><a class="top-link" href="index.html">← Retour à l’inscription</a></nav>
  <header class="hero"><span class="eyebrow">La communauté</span><h1>Les stagiaires</h1><p class="lead">Retrouvez les profils inscrits et leurs photos hébergées dans le cloud.</p></header>
  <div class="toolbar"><span class="count" id="count">Chargement…</span><a class="button" href="index.html">+ Ajouter un stagiaire</a></div>
  <section class="grid" id="grid" aria-live="polite"><p class="notice">Chargement des profils…</p></section>
  <footer class="footer">Atelier 6 · Les données sont chargées depuis la base MySQL.</footer>
</main>
<script>
  const grid = document.querySelector('#grid');
  const count = document.querySelector('#count');
  const dateFormatter = new Intl.DateTimeFormat('fr-FR', { dateStyle: 'medium' });
  function textElement(tag, className, text) { const node = document.createElement(tag); node.className = className; node.textContent = text; return node; }
  async function loadTrainees() {
    try {
      const response = await fetch('/api/liste.php', { headers: { Accept: 'application/json' } });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || 'La liste ne peut pas être chargée.');
      const trainees = Array.isArray(result.stagiaires) ? result.stagiaires : [];
      count.textContent = `${trainees.length} ${trainees.length > 1 ? 'stagiaires inscrits' : 'stagiaire inscrit'}`;
      grid.replaceChildren();
      if (!trainees.length) { grid.append(textElement('p', 'notice', 'Aucun stagiaire pour le moment. Les nouvelles inscriptions apparaîtront ici.')); return; }
      for (const trainee of trainees) {
        const card = document.createElement('article'); card.className = 'card';
        const image = document.createElement('img'); image.className = 'photo'; image.src = trainee.photo; image.alt = `Photo de ${trainee.prenom} ${trainee.nom}`; image.loading = 'lazy'; image.referrerPolicy = 'no-referrer';
        const body = document.createElement('div'); body.className = 'card-body';
        body.append(textElement('h2', 'name', `${trainee.prenom} ${trainee.nom}`), textElement('p', 'city', trainee.ville));
        const date = trainee.date_inscription ? new Date(String(trainee.date_inscription).replace(' ', 'T')) : null;
        body.append(textElement('time', 'date', date && !Number.isNaN(date.valueOf()) ? `Inscrit·e le ${dateFormatter.format(date)}` : 'Date d’inscription indisponible'));
        card.append(image, body); grid.append(card);
      }
    } catch (error) {
      count.textContent = 'Liste indisponible';
      const notice = textElement('p', 'notice error', error.message || 'Impossible de charger les stagiaires.');
      grid.replaceChildren(notice);
    }
  }
  loadTrainees();
</script></body></html>
